[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "picows>=2.3.1,<2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "yticker"
dynamic = ["version"]
description = "Fast Cython websocket client for Yahoo Finance streaming quotes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tapan Hazarika", email = "tapanhaz@gmail.com" }]
keywords = ["yahoo", "finance", "websocket", "cython", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
    "picows>=2.3.1,<2.4",
    "orjson",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "winloop>=0.1.0; sys_platform == 'win32'",
]


[project.urls]
Homepage = "https://github.com/Tapanhaz/yticker"
Repository = "https://github.com/Tapanhaz/yticker"
Issues = "https://github.com/Tapanhaz/yticker/issues"

[tool.setuptools]
packages = ["yticker"]
include-package-data = false
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "yticker.__version__" }

[tool.setuptools.package-data]
yticker = ["*.pyi", "py.typed"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "cp39-* *-win32 *-manylinux_i686 *-musllinux_* pp*"
build-verbosity = 1
test-command = "python -c \"import yticker; from yticker import YTicker; print('yticker', yticker.__version__)\""